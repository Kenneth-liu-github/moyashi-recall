name: Swift Validation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v0.14-final-appicon

concurrency:
  group: swift-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Run portable core tests
        run: swift test

  ios-simulator-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run full macOS and iOS validation
        run: bash scripts/validate-macos.sh
