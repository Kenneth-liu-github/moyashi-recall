name: Swift Validation

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

concurrency:
  group: swift-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build reusable package
        run: swift build
      - name: Run unit tests
        run: swift test
      - name: Build iOS app for Simulator
        run: |
          xcodebuild -project App/MoyashiRecall.xcodeproj \
            -scheme MoyashiRecall \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
