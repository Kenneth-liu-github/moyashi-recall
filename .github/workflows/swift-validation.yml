name: Swift Validation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v0.4-ai-extraction

concurrency:
  group: swift-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Run portable core tests
        run: swift test

  ios-simulator-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS app for Simulator
        run: |
          xcodebuild -project App/MoyashiRecall.xcodeproj \
            -scheme MoyashiRecall \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
