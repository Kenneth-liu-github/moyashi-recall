name: Swift Validation

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  package-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build reusable package
        run: swift build
      - name: Run unit tests
        run: swift test
